<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Love</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
}

/* Container */
.container {
  position: absolute;
  width: 100%;
  height: 100%;
}

/* Texto */
.word {
  position: absolute;
  color: #f3f177;
  font-size: 14px;
  font-family: Arial;
  text-shadow: 0 0 5px #ff8fb1, 0 0 10px #f3f177, 0 0 20px #f3f177;
  white-space: nowrap;
}
</style>
</head>

<body>

<div class="container" id="heart"></div>

<script>
const container = document.getElementById("heart");

let words = [];
let total = 250;

// Criar palavras
for (let i = 0; i < total; i++) {
  let span = document.createElement("span");
  span.innerText = "I love you";
  span.classList.add("word");

  container.appendChild(span);
  words.push({ el: span, t: Math.random() * Math.PI * 2 });
}

// Função animada
function animate() {
  words.forEach((w, i) => {
    w.t += 0.02;

    let t = w.t + i * 0.02;

    // Fórmula do coração ❤️
    let x = 16 * Math.pow(Math.sin(t), 3);
    let y = 13 * Math.cos(t)
          - 5 * Math.cos(2*t)
          - 2 * Math.cos(3*t)
          - Math.cos(4*t);

    let scale = 15;

    let posX = window.innerWidth / 2 + x * scale;
    let posY = window.innerHeight / 2 - y * scale;

    w.el.style.left = posX + "px";
    w.el.style.top = posY + "px";
  });

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
